<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platzi Store Manager</title>
    <!-- Добавяме модерен шрифт и икони -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="container">
            <!-- Място за съобщения -->
            <div id="message" class="message"></div>

            <!-- ЕКРАН 1: Таблица -->
            <div id="products-view" class="fade-in">
                <div class="header-actions">
                    <div class="title-group">
                        <h1> Управление на продукти</h1>
                        <p class="subtitle">Преглед и редакция на наличностите</p>
                    </div>
                    <button id="btnOpenAdd" class="btn btn-primary shadow-hover">
                        <span>+</span> Нов продукт
                    </button>
                </div>

                <div class="table-card">
                    <div class="table-responsive">
                        <table id="productsTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Снимка</th>
                                    <th>Заглавие</th>
                                    <th>Цена</th>
                                    <th>Категория</th>
                                    <th class="text-right">Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Тук JS ще попълни редовете -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ЕКРАН 2: Форма -->
            <div id="form-view" class="hidden fade-in">
                <div class="form-card">
                    <div class="form-header">
                        <h1 id="formTitle">Добави нов продукт</h1>
                        <p>Попълнете детайлите по-долу</p>
                    </div>
                    
                    <div class="form-body">
                        <input type="hidden" id="editId">

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="title">Заглавие</label>
                                <input type="text" id="title" placeholder="Напр. Smart Watch">
                            </div>

                            <div class="form-group">
                                <label for="price">Цена ($)</label>
                                <input type="number" id="price" min="0" placeholder="0.00">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="category">Категория</label>
                            <div class="select-wrapper">
                                <select id="category">
                                    <option value="" disabled selected>Зареждане на категории...</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="description">Описание</label>
                            <textarea id="description" rows="5" placeholder="Въведете детайлно описание на продукта..."></textarea>
                        </div>

                        <div class="button-group">
                            <button type="button" id="btnCancel" class="btn btn-outline">Отказ</button>
                            <button type="button" id="btnSave" class="btn btn-success shadow-hover">Запази Промените</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
